name: security-injection

on:
  pull_request:
  workflow_dispatch:

jobs:
  injection-baseline:
    runs-on: ubuntu-latest
    env:
      ENABLE_GUARDRAILS: "1"
      GUARDRAILS_MODE: "minimal_blocking"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-minimal.txt

      - name: Run minimal injection suite
        run: |
          python security/bipia_runner.py \
            --dataset security/minimal_injection_cases.json \
            --output security/injection_report.json \
            --threshold 0.85

      - name: Upload injection report
        uses: actions/upload-artifact@v4
        with:
          name: security-injection-artifacts
          path: security/injection_report.json
